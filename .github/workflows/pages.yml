# Build the dashboard and publish it on GitHub Pages.
# The backend URL (the Cloud Run service) comes from the repository variable
# MEDRA_BACKEND_URL (Settings → Secrets and variables → Actions → Variables),
# e.g. https://medra-<hash>.europe-west1.run.app. It is a public URL, not a secret.
name: Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check the backend URL is set
        run: test -n "${{ vars.MEDRA_BACKEND_URL }}" || (echo "Set the MEDRA_BACKEND_URL repository variable" && exit 1)
      - run: npm run build
        env:
          VITE_BACKEND_URL: ${{ vars.MEDRA_BACKEND_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
