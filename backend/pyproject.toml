[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "medra"
version = "0.1.0"
description = "MeDRA: real-time text mining of a model's chain-of-thought"
requires-python = ">=3.11"
# Exact versions are pinned in requirements.lock (pip freeze) for reproducibility.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6",
    "spacy>=3.8,<3.9",
    "scikit-learn>=1.5",
    "networkx>=3.3",
    "httpx>=0.27",  # streaming calls to the DeepSeek API
    "python-dotenv>=1.0",  # DEEPSEEK_API_KEY from .env in local runs
    "en_core_web_md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
    "es_core_news_md @ https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# scripts/screenshots.py (report figures); browsers come from `playwright install`
figures = ["playwright>=1.45"]
# eval/ (python -m eval.run, eval.tune, eval.bench, eval.figures): plots for the report
eval = ["matplotlib>=3.8", "pytest>=8"]

[project.scripts]
medra-source = "medra.cli:source_main"
medra-mine = "medra.cli:mine_main"
medra-present = "medra.cli:present_main"
medra-serve = "medra.cli:serve_main"

[tool.setuptools.packages.find]
include = ["medra*"]

[tool.setuptools.package-data]
"medra.mining" = ["lexicons/*.yaml", "models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
